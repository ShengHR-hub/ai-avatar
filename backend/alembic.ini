# Alembic configuration (ENG-01 step 2).
#
# IMPORTANT: this file must stay pure ASCII.
# Alembic reads alembic.ini with the *locale* encoding (alembic/util/compat.py
# uses encoding="locale"), so non-ASCII comments break every alembic command on
# Windows hosts whose locale is GBK/CP936. Keep all comments in English here.
#
# Boundaries:
# - The connection string is NOT stored here. backend/alembic/env.py reads the
#   server-side environment variable DATABASE_URL, so credentials never enter
#   the repository, logs or commit history
#   (see docs/architecture/09-repository-boundary.md section 6.1).
# - Migrations run from an empty PostgreSQL database only; legacy SQLite/Drizzle
#   tables are never read or converted.
# - Applied revisions must never be edited, only appended
#   (see docs/architecture/02-database-design.md section 7).
#
# Usage (working directory backend/):
#   alembic upgrade head            # upgrade an empty database (needs DATABASE_URL)
#   alembic upgrade head --sql      # offline SQL generation, no database connection
#   alembic downgrade -1            # local testing only, never a production strategy

[alembic]
# Anchor the script directory to this file, so any working directory works
script_location = %(here)s/alembic
# Make the `app` package importable regardless of the caller's working directory
prepend_sys_path = %(here)s
path_separator = os
# Injected by env.py
sqlalchemy.url =
# Revision files are named 0001_xxx so the frozen order is reviewable at a glance
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 60

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
